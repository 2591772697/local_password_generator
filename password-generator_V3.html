<!-- pw-generator_V3.html -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>密码生成器 V3</title>
  <style>
    :root{
      --bg:#0f172a;
      --panel:#111827;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --border:#334155;
      --accent:#38bdf8;
      --accent2:#22c55e;
      --danger:#ef4444;
      --chip:#1e293b;
      --btn:#334155;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      padding:24px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      background:linear-gradient(180deg,#0f172a 0%,#111827 100%);
      color:var(--text);
      display:grid;
      place-items:center;
    }
    .card{
      width:min(980px,100%);
      background:rgba(17,24,39,.92);
      border:1px solid var(--border);
      border-radius:18px;
      padding:24px;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
      backdrop-filter:blur(10px);
    }
    h1{margin:0 0 8px;font-size:28px}
    .sub{margin:0 0 22px;color:var(--muted);line-height:1.6}
    .grid{
      display:grid;
      grid-template-columns:repeat(12,1fr);
      gap:14px;
    }
    .panel{
      grid-column:span 12;
      border:1px solid var(--border);
      border-radius:14px;
      padding:16px;
      background:rgba(15,23,42,.55);
    }
    @media (min-width: 860px){
      .half{grid-column:span 6}
    }

    label{
      display:block;
      font-size:14px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .stepper{
      display:flex;
      align-items:stretch;
      gap:10px;
    }
    .stepper input{
      flex:1;
      min-width:0;
      border:1px solid var(--border);
      background:#0b1220;
      color:var(--text);
      border-radius:12px;
      padding:14px 14px;
      outline:none;
      font-size:18px;
      text-align:center;
    }
    .stepper input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(56,189,248,.15);
    }
    .stepper-btn{
      width:56px;
      min-width:56px;
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--btn);
      color:white;
      font-size:24px;
      font-weight:700;
      cursor:pointer;
      user-select:none;
      transition:transform .08s ease, opacity .2s ease, background .2s ease;
    }
    .stepper-btn:hover{opacity:.92}
    .stepper-btn:active{transform:translateY(1px)}
    .stepper-btn:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(56,189,248,.15);
    }

    .checks{
      display:flex;
      flex-wrap:wrap;
      gap:12px 18px;
    }
    .check{
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
      color:var(--text);
      font-size:15px;
    }

    input[type="text"], textarea{
      width:100%;
      border:1px solid var(--border);
      background:#0b1220;
      color:var(--text);
      border-radius:10px;
      padding:12px 14px;
      outline:none;
      font-size:16px;
    }
    input[type="text"]:focus, textarea:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(56,189,248,.15);
    }
    textarea{
      min-height:240px;
      resize:vertical;
      line-height:1.6;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    .hint{
      margin-top:10px;
      font-size:13px;
      color:var(--muted);
      line-height:1.6;
    }
    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:14px;
    }
    button{
      appearance:none;
      border:0;
      border-radius:10px;
      padding:12px 16px;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      color:white;
      background:var(--accent);
      transition:transform .08s ease, opacity .2s ease;
    }
    button:hover{opacity:.92}
    button:active{transform:translateY(1px)}
    .secondary{background:#334155}
    .success{background:var(--accent2)}
    .danger{background:var(--danger)}
    .error{
      color:#fca5a5;
      margin-top:10px;
      min-height:20px;
      font-size:14px;
    }
    .stats{
      margin-top:10px;
      color:var(--muted);
      font-size:13px;
      display:flex;
      flex-wrap:wrap;
      gap:10px 16px;
    }
    .badge{
      border:1px solid var(--border);
      border-radius:999px;
      padding:4px 10px;
      background:rgba(148,163,184,.08);
    }
    .output-list{
      display:grid;
      gap:10px;
      margin-top:12px;
    }
    .out-item{
      display:flex;
      gap:10px;
      align-items:center;
      padding:12px 14px;
      border:1px solid var(--border);
      border-radius:10px;
      background:#0b1220;
      overflow:hidden;
    }
    .pw{
      flex:1;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      word-break:break-all;
      white-space:pre-wrap;
      line-height:1.5;
      color:#f8fafc;
    }
    .mini{
      padding:8px 10px;
      font-size:13px;
      border-radius:8px;
      background:#334155;
      flex:0 0 auto;
    }
    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:var(--chip);
      border:1px solid var(--border);
      color:var(--text);
      font-size:13px;
      user-select:none;
    }
    .inline{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .count-help{
      margin-top:10px;
      color:var(--muted);
      font-size:13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>密码生成器 V3</h1>
    <p class="sub">
      这版把“位数 / 组数”的调整按钮加大了，点按更顺手；仍然是单文件 HTML、零依赖、双击即用。
    </p>

    <div class="grid">
      <section class="panel half">
        <label for="length">密码位数</label>
        <div class="stepper">
          <button class="stepper-btn" id="lengthDown" type="button" aria-label="减少位数">−</button>
          <input id="length" type="number" min="1" max="256" value="16" inputmode="numeric" />
          <button class="stepper-btn" id="lengthUp" type="button" aria-label="增加位数">+</button>
        </div>
        <div class="hint">建议 8~32 位；默认 16 位。可直接键盘输入，也可点左右按钮微调。</div>
      </section>

      <section class="panel half">
        <label for="count">生成组数（1~10）</label>
        <div class="stepper">
          <button class="stepper-btn" id="countDown" type="button" aria-label="减少组数">−</button>
          <input id="count" type="number" min="1" max="10" value="1" inputmode="numeric" />
          <button class="stepper-btn" id="countUp" type="button" aria-label="增加组数">+</button>
        </div>
        <div class="count-help">一次生成多组，直接复制全部结果即可。</div>
      </section>

      <section class="panel">
        <label>字符集</label>
        <div class="checks">
          <label class="check"><input id="lower" type="checkbox" checked /> 小写字母 a-z</label>
          <label class="check"><input id="upper" type="checkbox" checked /> 大写字母 A-Z</label>
          <label class="check"><input id="digits" type="checkbox" checked /> 数字 0-9</label>
          <label class="check"><input id="special" type="checkbox" /> 特殊字符</label>
        </div>

        <div style="height:12px"></div>

        <label for="specialChars">特殊字符内容</label>
        <input id="specialChars" type="text" value="!@#$%^&*()-_=+[]{};:,.?/~" disabled />
        <div class="hint">勾选“特殊字符”后，这里的字符会被纳入生成池；也可以自己删改内容。</div>
      </section>

      <section class="panel">
        <label>生成结果</label>
        <div class="inline">
          <div class="chip" id="summaryChip">等待生成</div>
          <div class="chip" id="poolChip">字符池：0</div>
        </div>

        <div class="toolbar">
          <button id="generate">生成密码</button>
          <button id="copyAll" class="success">复制全部</button>
          <button id="clear" class="secondary">清空</button>
        </div>

        <div id="output" class="output-list"></div>
        <div class="stats" id="stats"></div>
        <div class="error" id="error"></div>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const LOWER = "abcdefghijklmnopqrstuvwxyz";
    const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const DIGITS = "0123456789";

    const lengthEl = $("length");
    const countEl = $("count");
    const lowerEl = $("lower");
    const upperEl = $("upper");
    const digitsEl = $("digits");
    const specialEl = $("special");
    const specialCharsEl = $("specialChars");
    const outputEl = $("output");
    const errorEl = $("error");
    const statsEl = $("stats");
    const summaryChip = $("summaryChip");
    const poolChip = $("poolChip");

    const lengthDown = $("lengthDown");
    const lengthUp = $("lengthUp");
    const countDown = $("countDown");
    const countUp = $("countUp");

    function randomInt(maxExclusive) {
      const arr = new Uint32Array(1);
      const limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
      let x;
      do {
        crypto.getRandomValues(arr);
        x = arr[0];
      } while (x >= limit);
      return x % maxExclusive;
    }

    function generatePassword(pool, length) {
      let out = "";
      for (let i = 0; i < length; i++) {
        out += pool[randomInt(pool.length)];
      }
      return out;
    }

    function clampInt(value, min, max, fallback) {
      const n = parseInt(value, 10);
      if (Number.isNaN(n)) return fallback;
      return Math.max(min, Math.min(max, n));
    }

    function setStepperValue(inputEl, delta, min, max) {
      const current = clampInt(inputEl.value, min, max, min);
      inputEl.value = Math.max(min, Math.min(max, current + delta));
      generate();
    }

    function buildPool() {
      let pool = "";
      const selected = [];

      if (lowerEl.checked) {
        pool += LOWER;
        selected.push("小写");
      }
      if (upperEl.checked) {
        pool += UPPER;
        selected.push("大写");
      }
      if (digitsEl.checked) {
        pool += DIGITS;
        selected.push("数字");
      }
      if (specialEl.checked) {
        const s = specialCharsEl.value;
        if (!s.length) throw new Error("你勾选了特殊字符，但字符内容为空。");
        pool += s;
        selected.push("特殊字符");
      }

      if (!pool.length) throw new Error("请至少选择一种字符集。");
      return { pool, selected };
    }

    function escapeHtml(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderOutput(list) {
      outputEl.innerHTML = list.map((pw, idx) => `
        <div class="out-item">
          <div class="pw">${escapeHtml(pw)}</div>
          <button class="mini" data-copy="${idx}">复制</button>
        </div>
      `).join("");

      outputEl.querySelectorAll("[data-copy]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const index = Number(btn.getAttribute("data-copy"));
          await navigator.clipboard.writeText(list[index]);
          errorEl.textContent = `已复制第 ${index + 1} 组密码。`;
          setTimeout(() => {
            if (errorEl.textContent === `已复制第 ${index + 1} 组密码。`) errorEl.textContent = "";
          }, 1200);
        });
      });
    }

    function renderStats(selected, poolLen, length, count) {
      statsEl.innerHTML = [
        `<span class="badge">字符集：${selected.join(" / ")}</span>`,
        `<span class="badge">字符池大小：${poolLen}</span>`,
        `<span class="badge">位数：${length}</span>`,
        `<span class="badge">组数：${count}</span>`,
      ].join("");
      poolChip.textContent = `字符池：${poolLen}`;
      summaryChip.textContent = `已生成 ${count} 组，每组 ${length} 位`;
    }

    function generate() {
      errorEl.textContent = "";

      const length = clampInt(lengthEl.value, 1, 256, 16);
      const count = clampInt(countEl.value, 1, 10, 1);

      lengthEl.value = length;
      countEl.value = count;

      try {
        const { pool, selected } = buildPool();
        const list = Array.from({ length: count }, () => generatePassword(pool, length));
        renderOutput(list);
        renderStats(selected, pool.length, length, count);
      } catch (err) {
        outputEl.innerHTML = "";
        statsEl.innerHTML = "";
        summaryChip.textContent = "生成失败";
        poolChip.textContent = "字符池：0";
        errorEl.textContent = err.message || String(err);
      }
    }

    async function copyAll() {
      const text = Array.from(outputEl.querySelectorAll(".pw"))
        .map(el => el.textContent)
        .filter(Boolean)
        .join("\n");

      if (!text) {
        errorEl.textContent = "没有可复制的内容。";
        return;
      }

      await navigator.clipboard.writeText(text);
      errorEl.textContent = "已复制全部结果到剪贴板。";
      setTimeout(() => {
        if (errorEl.textContent === "已复制全部结果到剪贴板。") errorEl.textContent = "";
      }, 1200);
    }

    function toggleSpecial() {
      specialCharsEl.disabled = !specialEl.checked;
      generate();
    }

    $("generate").addEventListener("click", generate);
    $("copyAll").addEventListener("click", copyAll);
    $("clear").addEventListener("click", () => {
      outputEl.innerHTML = "";
      statsEl.innerHTML = "";
      errorEl.textContent = "";
      summaryChip.textContent = "等待生成";
      poolChip.textContent = "字符池：0";
    });

    lengthDown.addEventListener("click", () => setStepperValue(lengthEl, -1, 1, 256));
    lengthUp.addEventListener("click", () => setStepperValue(lengthEl, 1, 1, 256));
    countDown.addEventListener("click", () => setStepperValue(countEl, -1, 1, 10));
    countUp.addEventListener("click", () => setStepperValue(countEl, 1, 1, 10));

    [lengthEl, countEl].forEach((el) => {
      el.addEventListener("input", generate);
      el.addEventListener("change", generate);
      el.addEventListener("blur", generate);
    });

    [lowerEl, upperEl, digitsEl, specialEl, specialCharsEl].forEach((el) => {
      el.addEventListener("input", () => {
        if (el === specialEl) toggleSpecial();
        else generate();
      });
      el.addEventListener("change", () => {
        if (el === specialEl) toggleSpecial();
        else generate();
      });
    });

    generate();
  </script>
</body>
</html>
