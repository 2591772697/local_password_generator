<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>密码生成器 V6 — 高级过滤版</title>
<style>
:root {
  --bg:#0f172a;--panel:#111827;--text:#e5e7eb;--muted:#94a3b8;--border:#334155;
  --accent:#38bdf8;--accent2:#22c55e;--danger:#ef4444;--warning:#f59e0b;
  --chip:#1e293b;--btn:#334155;--radius:14px;--shadow:0 20px 60px rgba(0,0,0,.35);
  --cb-size:28px;--cb-radius:8px;--cb-bg:#0b1220;--cb-border:#475569;
  --cb-checked-bg:var(--accent);--cb-checked-border:var(--accent);
  --cb-hover-border:#60a5fa;--cb-focus-ring:rgba(56,189,248,.35);--cb-check-mark:#0f172a;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#0f172a 0%,#111827 100%);color:var(--text);display:grid;place-items:center}
.card{width:min(980px,100%);background:rgba(17,24,39,.92);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
h1{margin:0 0 8px;font-size:28px;letter-spacing:-.3px}
.sub{margin:0 0 22px;color:var(--muted);line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.panel{grid-column:span 12;border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:rgba(15,23,42,.55)}
@media(min-width:860px){.half{grid-column:span 6}}
.panel-label{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-bottom:8px;letter-spacing:.2px}
.mode-switch{display:inline-flex;background:var(--chip);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px}
.mode-btn{appearance:none;border:0;border-radius:10px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;color:var(--muted);background:transparent;transition:all .2s ease}
.mode-btn.active{background:var(--accent);color:#0f172a}
.mode-btn:hover:not(.active){color:var(--text)}
.stepper{display:flex;align-items:stretch;gap:10px}
.stepper input{flex:1;min-width:0;border:1px solid var(--border);background:#0b1220;color:var(--text);border-radius:12px;padding:14px 14px;outline:none;font-size:18px;text-align:center;transition:border-color .2s,box-shadow .2s}
.stepper input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.stepper-btn{width:56px;min-width:56px;border:1px solid var(--border);border-radius:12px;background:var(--btn);color:white;font-size:24px;font-weight:700;cursor:pointer;user-select:none;transition:transform .08s ease,opacity .2s ease,background .2s ease,border-color .2s}
.stepper-btn:hover{opacity:.92;background:#3b4a5f}
.stepper-btn:active{transform:translateY(1px)}
.stepper-btn:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.hint{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.6}
.hint.warn{color:var(--warning)}
.checks{display:flex;flex-wrap:wrap;gap:14px 24px}
.check{display:inline-flex;align-items:center;gap:12px;user-select:none;color:var(--text);font-size:15px;cursor:pointer;transition:color .2s}
.check:hover .cb__control{border-color:var(--cb-hover-border)}
.check:hover .cb__label{color:#f1f5f9}
.check input[type="checkbox"]{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.cb__control{flex:0 0 var(--cb-size);width:var(--cb-size);height:var(--cb-size);border:2px solid var(--cb-border);border-radius:var(--cb-radius);background:var(--cb-bg);display:grid;place-items:center;transition:all .18s cubic-bezier(.34,1.56,.64,1);position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.cb__control .cb__checkmark{opacity:0;transform:scale(0.6) rotate(-10deg);transition:all .18s cubic-bezier(.34,1.56,.64,1);color:var(--cb-check-mark);font-size:calc(var(--cb-size)*.55);font-weight:700;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.1);pointer-events:none}
.check input[type="checkbox"]:checked+.cb__control{background:var(--cb-checked-bg);border-color:var(--cb-checked-border);box-shadow:0 0 0 4px rgba(56,189,248,.15),inset 0 2px 4px rgba(0,0,0,.1)}
.check input[type="checkbox"]:checked+.cb__control .cb__checkmark{opacity:1;transform:scale(1) rotate(0deg)}
.check input[type="checkbox"]:focus-visible+.cb__control{outline:2px solid var(--accent);outline-offset:3px}
.check input[type="checkbox"]:disabled+.cb__control{opacity:.5;cursor:not-allowed;filter:grayscale(.4)}
.check input[type="checkbox"]:disabled~.cb__label{opacity:.5;cursor:not-allowed}
.cb__label{transition:color .2s;line-height:1.3}
.cb__label small{color:var(--muted);font-size:12px;font-weight:400}
.advanced-tag{display:inline-block;font-size:11px;font-weight:600;color:#a78bfa;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.25);border-radius:6px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.strength-panel{margin-top:12px;padding:14px;border-radius:12px;background:rgba(15,23,42,.7);border:1px solid var(--border)}
.strength-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.strength-title{font-size:14px;font-weight:600;color:var(--muted)}
.strength-score{font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(148,163,184,.1)}
.strength-bar-bg{height:8px;background:var(--chip);border-radius:999px;overflow:hidden}
.strength-bar-fill{height:100%;width:0%;border-radius:999px;transition:width .4s cubic-bezier(.34,1.56,.64,1),background .3s ease}
.strength-details{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.strength-weak{color:#ef4444;background:rgba(239,68,68,.15)}
.strength-fair{color:#f59e0b;background:rgba(245,158,11,.15)}
.strength-good{color:#38bdf8;background:rgba(56,189,248,.15)}
.strength-strong{color:#22c55e;background:rgba(34,197,94,.15)}
.strength-excellent{color:#a78bfa;background:rgba(167,139,250,.15)}
.bar-weak{background:linear-gradient(90deg,#ef4444,#f87171)}
.bar-fair{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar-good{background:linear-gradient(90deg,#38bdf8,#60a5fa)}
.bar-strong{background:linear-gradient(90deg,#22c55e,#4ade80)}
.bar-excellent{background:linear-gradient(90deg,#a78bfa,#c4b5fd)}
input[type="text"],textarea{width:100%;border:1px solid var(--border);background:#0b1220;color:var(--text);border-radius:10px;padding:12px 14px;outline:none;font-size:16px;transition:border-color .2s,box-shadow .2s}
input[type="text"]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
textarea{min-height:240px;resize:vertical;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{appearance:none;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;color:white;background:var(--accent);transition:transform .08s ease,opacity .2s ease,background .2s}
button:hover{opacity:.92}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.secondary{background:#334155}
.secondary:hover{background:#475569}
.success{background:var(--accent2)}
.success:hover{background:#2dd4bf}
.danger{background:var(--danger)}
.danger:hover{background:#f87171}
.error{color:#fca5a5;margin-top:10px;min-height:20px;font-size:14px}
.stats{margin-top:10px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:10px 16px}
.badge{border:1px solid var(--border);border-radius:999px;padding:4px 10px;background:rgba(148,163,184,.08)}
.output-list{display:grid;gap:10px;margin-top:12px}
.out-item{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#0b1220;overflow:hidden}
.pw{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;white-space:pre-wrap;line-height:1.5;color:#f8fafc}
.mini{padding:8px 10px;font-size:13px;border-radius:8px;background:#334155;flex:0 0 auto;border:0;color:white;cursor:pointer;transition:background .2s,transform .08s}
.mini:hover{background:#475569}
.mini:active{transform:translateY(1px)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--chip);border:1px solid var(--border);color:var(--text);font-size:13px;user-select:none}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hidden{display:none !important}
@media(max-width:600px){:root{--cb-size:26px;--cb-radius:7px}.card{padding:16px}.checks{gap:10px 16px}.check{font-size:14px;gap:10px}.stepper-btn{width:48px;min-width:48px;font-size:20px}.stepper input{font-size:16px;padding:12px 10px}}
@media(max-width:400px){:root{--cb-size:24px;--cb-radius:6px}.check{font-size:13px;gap:8px}.cb__control .cb__checkmark{font-size:calc(var(--cb-size)*.5)}}
</style>
</head>
<body>
<main class="card">
<h1>🔐 密码生成器 V6</h1>
<p class="sub">新增 PIN 模式、智能强度检测、字符集强制覆盖、3 项高级过滤；单文件 HTML、零依赖、即开即用。</p>

<div class="panel" style="display:flex;justify-content:center;">
  <div class="mode-switch">
    <button class="mode-btn active" id="modePassword" type="button">🔑 普通密码</button>
    <button class="mode-btn" id="modePin" type="button">🔢 PIN 密码</button>
  </div>
</div>

<div class="grid">
  <section class="panel half" id="pwLengthPanel">
    <label class="panel-label" for="length">密码位数</label>
    <div class="stepper">
      <button class="stepper-btn" id="lengthDown" type="button" aria-label="减少位数">−</button>
      <input id="length" type="number" min="1" max="256" value="16" inputmode="numeric" />
      <button class="stepper-btn" id="lengthUp" type="button" aria-label="增加位数">+</button>
    </div>
    <div class="hint" id="lengthHint">建议 8~32 位；默认 16 位。</div>
  </section>

  <section class="panel half hidden" id="pinLengthPanel">
    <label class="panel-label" for="pinLength">PIN 位数</label>
    <div class="stepper">
      <button class="stepper-btn" id="pinLengthDown" type="button" aria-label="减少位数">−</button>
      <input id="pinLength" type="number" min="3" max="32" value="6" inputmode="numeric" />
      <button class="stepper-btn" id="pinLengthUp" type="button" aria-label="增加位数">+</button>
    </div>
    <div class="hint">纯数字 PIN，支持 3~32 位；默认 6 位。</div>
  </section>

  <section class="panel half">
    <label class="panel-label" for="count">生成组数（1~10）</label>
    <div class="stepper">
      <button class="stepper-btn" id="countDown" type="button" aria-label="减少组数">−</button>
      <input id="count" type="number" min="1" max="10" value="1" inputmode="numeric" />
      <button class="stepper-btn" id="countUp" type="button" aria-label="增加组数">+</button>
    </div>
    <div class="hint">一次生成多组，直接复制全部结果即可。</div>
  </section>

  <section class="panel" id="charsetPanel">
    <label class="panel-label">字符集 <span style="color:var(--muted);font-weight:400;font-size:13px;">（勾选 N 种则密码至少含 N 位，每种至少 1 个）</span></label>
    <div class="checks">
      <label class="check"><input id="lower" type="checkbox" checked /><span class="cb__control"><span class="cb__checkmark">✓</span></span><span class="cb__label">小写字母 a–z</span></label>
      <label class="check"><input id="upper" type="checkbox" checked /><span class="cb__control"><span class="cb__checkmark">✓</span></span><span class="cb__label">大写字母 A–Z</span></label>
      <label class="check"><input id="digits" type="checkbox" checked /><span class="cb__control"><span class="cb__checkmark">✓</span></span><span class="cb__label">数字 0–9</span></label>
      <label class="check"><input id="special" type="checkbox" /><span class="cb__control"><span class="cb__checkmark">✓</span></span><span class="cb__label">特殊字符</span></label>
    </div>
    <div style="height:12px"></div>
    <label class="panel-label" for="specialChars">特殊字符内容</label>
    <input id="specialChars" type="text" value="!@#$%^&amp;*()-_=+[]{};:,.?/~" disabled />
    <div class="hint">勾选“特殊字符”后，这里的字符会被纳入生成池；也可以自己删改内容。</div>
  </section>

  <section class="panel" id="advancedPanel">
    <label class="panel-label">高级选项<span class="advanced-tag">V6 新增</span></label>
    <div class="checks">
      <label class="check"><input id="easySpeak" type="checkbox" /><span class="cb__control"><span class="cb__checkmark">✓</span></span><span class="cb__label">易于朗读 <small>（避免歧义字符）</small></span></label>
      <label class="check"><input id="easyRead" type="checkbox" /><span class="cb__control"><span class="cb__checkmark">✓</span></span><span class="cb__label">易于阅读 <small>（避免相似字符）</small></span></label>
      <label class="check"><input id="easyMobile" type="checkbox" /><span class="cb__control"><span class="cb__checkmark">✓</span></span><span class="cb__label">智能手机上输入简单</span></label>
    </div>
    <div class="hint" id="filterHint"></div>
  </section>

  <section class="panel">
    <label class="panel-label">生成结果</label>
    <div class="inline">
      <div class="chip" id="summaryChip">等待生成</div>
      <div class="chip" id="poolChip">字符池：0</div>
    </div>
    <div class="toolbar">
      <button id="generate">✨ 生成密码</button>
      <button id="copyAll" class="success">📋 复制全部</button>
      <button id="clear" class="secondary">🗑️ 清空</button>
    </div>
    <div class="strength-panel" id="strengthPanel" style="display:none;">
      <div class="strength-header">
        <span class="strength-title">🔍 密码强度检测</span>
        <span class="strength-score" id="strengthScore">--</span>
      </div>
      <div class="strength-bar-bg"><div class="strength-bar-fill" id="strengthBar"></div></div>
      <div class="strength-details" id="strengthDetails"></div>
    </div>
    <div id="output" class="output-list"></div>
    <div class="stats" id="stats"></div>
    <div class="error" id="error"></div>
  </section>
</div>
</main>

<script>
const LOWER="abcdefghijklmnopqrstuvwxyz";
const UPPER="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const DIGITS="0123456789";
const EXCLUDE_SPOKEN=new Set("lI1oO0B8S5Z2g9qG6T7".split(""));
const EXCLUDE_SIMILAR=new Set("lI1|0Oo5Ss8B2Zz6G9gq".split(""));
const EXCLUDE_MOBILE=new Set([..."ABCDEFGHIJKLMNOPQRSTUVWXYZ",..."!@#$%^&*()-_=+[]{};:,.?/~`\"\\|<>"]);

const $=id=>document.getElementById(id);
const els={
  length:$("length"),pinLength:$("pinLength"),count:$("count"),
  lower:$("lower"),upper:$("upper"),digits:$("digits"),special:$("special"),specialChars:$("specialChars"),
  easySpeak:$("easySpeak"),easyRead:$("easyRead"),easyMobile:$("easyMobile"),
  output:$("output"),error:$("error"),stats:$("stats"),
  summaryChip:$("summaryChip"),poolChip:$("poolChip"),
  strengthPanel:$("strengthPanel"),strengthScore:$("strengthScore"),strengthBar:$("strengthBar"),strengthDetails:$("strengthDetails"),
  modePassword:$("modePassword"),modePin:$("modePin"),
  pwLengthPanel:$("pwLengthPanel"),pinLengthPanel:$("pinLengthPanel"),
  charsetPanel:$("charsetPanel"),advancedPanel:$("advancedPanel"),
  lengthHint:$("lengthHint"),filterHint:$("filterHint")
};
let currentMode='password';

function randomInt(maxExclusive){
  if(maxExclusive<=0)return 0;
  if(maxExclusive>0x100000000)throw new Error("随机范围过大");
  const arr=new Uint32Array(1);
  const limit=0x100000000-(0x100000000%maxExclusive);
  let x;
  do{crypto.getRandomValues(arr);x=arr[0];}while(x>=limit);
  return x%maxExclusive;
}
function randomChar(str){return str[randomInt(str.length)];}
function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=randomInt(i+1);
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}
function clampInt(value,min,max,fallback){
  const n=parseInt(value,10);
  if(!Number.isFinite(n))return fallback;
  return Math.max(min,Math.min(max,n));
}

function setMode(mode){
  currentMode=mode;
  if(mode==='password'){
    els.modePassword.classList.add('active');els.modePin.classList.remove('active');
    els.pwLengthPanel.classList.remove('hidden');els.pinLengthPanel.classList.add('hidden');
    els.charsetPanel.classList.remove('hidden');els.advancedPanel.classList.remove('hidden');
  }else{
    els.modePin.classList.add('active');els.modePassword.classList.remove('active');
    els.pwLengthPanel.classList.add('hidden');els.pinLengthPanel.classList.remove('hidden');
    els.charsetPanel.classList.add('hidden');els.advancedPanel.classList.add('hidden');
  }
  generate();
}

function buildPool(){
  let pool="";const categories=[];
  if(els.lower.checked){pool+=LOWER;categories.push({name:"小写",chars:LOWER});}
  if(els.upper.checked){pool+=UPPER;categories.push({name:"大写",chars:UPPER});}
  if(els.digits.checked){pool+=DIGITS;categories.push({name:"数字",chars:DIGITS});}
  if(els.special.checked){
    const s=els.specialChars.value;
    if(!s.length)throw new Error("你勾选了特殊字符，但字符内容为空。");
    pool+=s;categories.push({name:"特殊字符",chars:s});
  }
  if(!pool.length)throw new Error("请至少选择一种字符集。");
  return{pool,categories};
}

function applyFilters(pool,categories){
  const exclude=new Set();
  if(els.easySpeak.checked)EXCLUDE_SPOKEN.forEach(c=>exclude.add(c));
  if(els.easyRead.checked)EXCLUDE_SIMILAR.forEach(c=>exclude.add(c));
  if(els.easyMobile.checked)EXCLUDE_MOBILE.forEach(c=>exclude.add(c));
  if(!exclude.size)return{pool,categories,removed:[]};
  const filteredPool=pool.split('').filter(c=>!exclude.has(c)).join('');
  const removed=[];
  const filteredCategories=categories.map(cat=>{
    const filteredChars=cat.chars.split('').filter(c=>!exclude.has(c)).join('');
    return{name:cat.name,chars:filteredChars};
  }).filter(cat=>{
    if(cat.chars.length===0){removed.push(cat.name);return false;}
    return true;
  });
  if(!filteredPool.length)throw new Error("高级选项过滤后没有可用字符，请调整选项。");
  if(!filteredCategories.length)throw new Error("高级选项过滤后没有可用字符类别，请调整选项。");
  return{pool:filteredPool,categories:filteredCategories,removed};
}

function generatePassword(pool,length,categories){
  const n=categories.length;
  if(length<n)throw new Error(`当前有效字符集 ${n} 种，密码位数不能小于 ${n}。`);
  const result=categories.map(cat=>randomChar(cat.chars));
  for(let i=n;i<length;i++)result.push(randomChar(pool));
  shuffle(result);
  return result.join("");
}
function generatePin(length){
  let out="";
  for(let i=0;i<length;i++)out+=randomChar(DIGITS);
  return out;
}
function escapeHtml(str){
  return str.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

function renderOutput(list){
  els.output.innerHTML=list.map((pw,idx)=>`<div class="out-item"><div class="pw">${escapeHtml(pw)}</div><button class="mini" data-copy="${idx}">复制</button></div>`).join("");
  els.output.querySelectorAll("[data-copy]").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      const index=Number(btn.getAttribute("data-copy"));
      await navigator.clipboard.writeText(list[index]);
      els.error.textContent=`✅ 已复制第 ${index+1} 组密码。`;
      setTimeout(()=>{if(els.error.textContent===`✅ 已复制第 ${index+1} 组密码。`)els.error.textContent="";},1500);
    });
  });
  if(list.length>0)analyzeStrength(list[0]);
}

function renderStats(selectedNames,poolLen,length,count,removedNames){
  const badges=[`<span class="badge">字符集：${selectedNames.join(" / ")||"数字"}</span>`,`<span class="badge">字符池大小：${poolLen}</span>`,`<span class="badge">位数：${length}</span>`,`<span class="badge">组数：${count}</span>`];
  if(removedNames&&removedNames.length)badges.push(`<span class="badge" style="color:var(--warning);border-color:var(--warning);">已过滤：${removedNames.join("、")}</span>`);
  els.stats.innerHTML=badges.join("");
  els.poolChip.textContent=`字符池：${poolLen}`;
  els.summaryChip.textContent=`已生成 ${count} 组，每组 ${length} 位`;
}

function analyzeStrength(password){
  if(!password){els.strengthPanel.style.display='none';return;}
  els.strengthPanel.style.display='block';
  const len=password.length;
  let poolSize=0,hasLower=/[a-z]/.test(password),hasUpper=/[A-Z]/.test(password),hasDigit=/\d/.test(password),hasSpecial=/[^a-zA-Z0-9]/.test(password);
  if(hasLower)poolSize+=26;if(hasUpper)poolSize+=26;if(hasDigit)poolSize+=10;if(hasSpecial)poolSize+=33;
  if(poolSize===0&&/^\d+$/.test(password))poolSize=10;
  let entropy=len*Math.log2(poolSize||1),penalties=0,reasons=[];
  const repeats=len-new Set(password).size;
  if(repeats>0){penalties+=repeats*0.5;reasons.push(`重复字符 -${(repeats*0.5).toFixed(1)} bits`);}
  const sequences=["abcdefghijklmnopqrstuvwxyz","ABCDEFGHIJKLMNOPQRSTUVWXYZ","0123456789","qwertyuiop","asdfghjkl","zxcvbnm"];
  let seqPenalty=0;
  for(let seq of sequences){for(let i=0;i<password.length-2;i++){if(seq.includes(password.slice(i,i+3)))seqPenalty+=3;}}
  if(seqPenalty>0){penalties+=seqPenalty;reasons.push(`连续/键盘序列 -${seqPenalty.toFixed(1)} bits`);}
  if(new Set(password).size===1){penalties+=entropy*0.9;reasons.push("全同字符 -90%");}
  if(len<8){penalties+=(8-len)*2;reasons.push(`长度过短 -${((8-len)*2).toFixed(1)} bits`);}
  const variety=[hasLower,hasUpper,hasDigit,hasSpecial].filter(Boolean).length;
  if(variety===1&&len>6){penalties+=len*0.3;reasons.push("字符单一 -30%");}
  let finalEntropy=Math.max(0,entropy-penalties);
  let grade,labelClass,barClass,percent;
  if(finalEntropy<28){grade="非常弱";labelClass="strength-weak";barClass="bar-weak";percent=Math.min(100,(finalEntropy/28)*20);}
  else if(finalEntropy<48){grade="弱";labelClass="strength-fair";barClass="bar-fair";percent=20+((finalEntropy-28)/20)*20;}
  else if(finalEntropy<64){grade="中等";labelClass="strength-good";barClass="bar-good";percent=40+((finalEntropy-48)/16)*20;}
  else if(finalEntropy<128){grade="强";labelClass="strength-strong";barClass="bar-strong";percent=60+((finalEntropy-64)/64)*20;}
  else{grade="极强";labelClass="strength-excellent";barClass="bar-excellent";percent=80+Math.min(20,(finalEntropy-128)/128*20);}
  els.strengthScore.textContent=`${grade} · ${finalEntropy.toFixed(1)} bits`;
  els.strengthScore.className=`strength-score ${labelClass}`;
  els.strengthBar.className=`strength-bar-fill ${barClass}`;
  els.strengthBar.style.width=`${percent}%`;
  const detailItems=[`字符多样性：${variety}/4`,`字符池：${poolSize}`,`理论熵：${entropy.toFixed(1)} bits`,`有效熵：${finalEntropy.toFixed(1)} bits`];
  if(reasons.length)detailItems.push(`惩罚：${reasons.join("；")}`);
  els.strengthDetails.innerHTML=detailItems.map(s=>`<span>${s}</span>`).join("");
}

function generate(){
  els.error.textContent="";
  els.filterHint.textContent="";
  els.filterHint.className="hint";
  const count=clampInt(els.count.value,1,10,1);
  els.count.value=count;
  let list=[],selectedNames=[],poolLen=0,length=0,removedNames=[];
  try{
    if(currentMode==='pin'){
      length=clampInt(els.pinLength.value,3,32,6);els.pinLength.value=length;
      poolLen=10;selectedNames=["数字"];
      list=Array.from({length:count},()=>generatePin(length));
    }else{
      length=clampInt(els.length.value,1,256,16);els.length.value=length;
      const{pool,categories}=buildPool();
      const filtered=applyFilters(pool,categories);
      const effectivePool=filtered.pool,effectiveCategories=filtered.categories;
      removedNames=filtered.removed||[];
      poolLen=effectivePool.length;
      selectedNames=effectiveCategories.map(c=>c.name);
      if(removedNames.length){els.filterHint.textContent=`高级选项已过滤掉：${removedNames.join('、')}（该类别无可用字符）`;els.filterHint.className="hint warn";}
      const minLen=effectiveCategories.length;
      if(length<minLen){length=minLen;els.length.value=length;els.lengthHint.textContent=`已自动调整为最小位数 ${minLen}（有效字符集 ${minLen} 种）。`;els.lengthHint.style.color="var(--warning)";}
      else{els.lengthHint.textContent="建议 8~32 位；默认 16 位。";els.lengthHint.style.color="";}
      list=Array.from({length:count},()=>generatePassword(effectivePool,length,effectiveCategories));
    }
    renderOutput(list);
    renderStats(selectedNames,poolLen,length,count,removedNames);
  }catch(err){
    els.output.innerHTML="";els.stats.innerHTML="";
    els.summaryChip.textContent="生成失败";els.poolChip.textContent="字符池：0";
    els.strengthPanel.style.display='none';
    els.error.textContent=err.message||String(err);
  }
}

async function copyAll(){
  const text=Array.from(els.output.querySelectorAll(".pw")).map(el=>el.textContent).filter(Boolean).join("\n");
  if(!text){els.error.textContent="没有可复制的内容。";return;}
  await navigator.clipboard.writeText(text);
  els.error.textContent="📋 已复制全部结果到剪贴板。";
  setTimeout(()=>{if(els.error.textContent==="📋 已复制全部结果到剪贴板。")els.error.textContent="";},1500);
}

function toggleSpecial(){els.specialChars.disabled=!els.special.checked;generate();}
function setStepperValue(inputEl,delta,min,max){const current=clampInt(inputEl.value,min,max,min);inputEl.value=Math.max(min,Math.min(max,current+delta));generate();}

$("generate").addEventListener("click",generate);
$("copyAll").addEventListener("click",copyAll);
$("clear").addEventListener("click",()=>{
  els.output.innerHTML="";els.stats.innerHTML="";els.error.textContent="";
  els.summaryChip.textContent="等待生成";els.poolChip.textContent="字符池：0";
  els.strengthPanel.style.display='none';els.filterHint.textContent="";els.filterHint.className="hint";
});
els.modePassword.addEventListener("click",()=>setMode('password'));
els.modePin.addEventListener("click",()=>setMode('pin'));
$("lengthDown").addEventListener("click",()=>setStepperValue(els.length,-1,1,256));
$("lengthUp").addEventListener("click",()=>setStepperValue(els.length,1,1,256));
$("pinLengthDown").addEventListener("click",()=>setStepperValue(els.pinLength,-1,3,32));
$("pinLengthUp").addEventListener("click",()=>setStepperValue(els.pinLength,1,3,32));
$("countDown").addEventListener("click",()=>setStepperValue(els.count,-1,1,10));
$("countUp").addEventListener("click",()=>setStepperValue(els.count,1,1,10));
[els.length,els.count,els.pinLength].forEach(el=>{el.addEventListener("input",generate);el.addEventListener("change",generate);el.addEventListener("blur",generate);});
[els.lower,els.upper,els.digits,els.special,els.specialChars,els.easySpeak,els.easyRead,els.easyMobile].forEach(el=>{
  el.addEventListener("input",()=>{if(el===els.special)toggleSpecial();else generate();});
  el.addEventListener("change",()=>{if(el===els.special)toggleSpecial();else generate();});
});
generate();
</script>
